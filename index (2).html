<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5d3f">
<title>হিসাব বন্ধু</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b5d3f;--gd:#07402b;--ink:#15221c;--mut:#5f6f66;--bg:#f3f6f2;--inc:#0b7a4b;--exp:#c8283c;--line:#d5dfd8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 'Hind Siliguri','Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px}
:focus-visible{outline:3px solid #f2b600;outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 110px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;max-width:420px;margin:0 auto}
.login h1{font-size:2.6rem;margin:0;color:var(--g);line-height:1.1}
.login p{margin:0;color:var(--mut)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--g);color:#fff;width:100%}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.link{background:none;border:0;color:var(--g);text-decoration:underline;font-weight:500}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}
.bar b{font-size:1.2rem;color:var(--g)}
.bar small{display:block;color:var(--mut);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;min-height:36px;margin-left:4px}
.panel{background:var(--g);color:#fff;border-radius:6px 6px 18px 18px;padding:18px 18px 14px;border-bottom:6px solid var(--gd)}
.panel span{opacity:.85}
.panel .big{font-size:2.5rem;font-weight:700;line-height:1.2}
.two{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px dashed rgba(255,255,255,.4);padding-top:10px}
.two div+div{border-left:1px dashed rgba(255,255,255,.4);padding-left:14px}
.two b{display:block;font-size:1.25rem}
.filters{display:grid;gap:8px;margin:16px 0 6px}
input,select{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:46px}
.chips{display:flex;gap:6px}
.chips button{flex:1;border:2px solid var(--line);background:#fff;border-radius:999px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0 12px 12px;border-bottom:1px solid var(--line);border-left:5px solid var(--inc)}
.row.expense{border-left-color:var(--exp)}
.row .amt{font-weight:700;text-align:right}
.row.income .amt{color:var(--inc)}.row.expense .amt{color:var(--exp)}
.row small{color:var(--mut)}
.row .del{grid-column:2;grid-row:2;background:none;border:0;color:var(--mut);min-height:32px;text-decoration:underline}
.empty{padding:28px 8px;text-align:center;color:var(--mut)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:488px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:1.1rem;min-height:54px}
.sheet{position:fixed;inset:0;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .in{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;display:grid;gap:10px;max-height:92vh;overflow:auto}
.sheet label{font-weight:500;display:grid;gap:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700}
.seg button.on.income{background:var(--inc);color:#fff;border-color:var(--inc)}
.seg button.on.expense{background:var(--exp);color:#fff;border-color:var(--exp)}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
.toast.on{opacity:1}
.vt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
.vt button{border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700}
.vt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.tally{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff;border:2px solid var(--ink)}
.tally th{background:var(--ink);color:#fff;padding:6px 4px;text-align:right;font-weight:500}
.tally th:first-child,.tally td:first-child{text-align:left;padding-left:8px}
.tally td{padding:6px 4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:right;vertical-align:top}
.tally td:last-child{border-right:0}
.tally small{color:var(--mut);display:block;line-height:1.3}
.tally .i{color:var(--inc);font-weight:700}
.tally .e{color:var(--exp);font-weight:700}
.tally .neg{color:var(--exp)}
.tally .del{background:none;border:0;color:var(--mut);text-decoration:underline;min-height:28px;padding:0;font-size:.8rem}
.tally tfoot td{background:#e3ece6;font-weight:700;border-top:2px solid var(--ink)}
</style>
</head>
<body>

<section id="login" class="login" hidden>
  <h1>হিসাব বন্ধু</h1>
  <p>আপনার দৈনিক আয়-ব্যয়ের সহজ হিসাব, যেকোনো ডিভাইসে।</p>
  <button class="btn" id="gLogin">Google দিয়ে লগইন করুন</button>
  <button class="link" id="demoBtn">লগইন ছাড়া টেস্ট মোডে দেখুন</button>
</section>

<main id="app" class="wrap" hidden>
  <div class="bar">
    <div><b>হিসাব বন্ধু</b><small id="who"></small></div>
    <div class="tools">
      <button id="dig" aria-label="সংখ্যার ধরন বদলান">১২৩</button>
      <button id="bak">ব্যাকআপ</button>
      <button id="out">বের হোন</button>
    </div>
  </div>

  <div class="panel">
    <span>বর্তমান ব্যালেন্স</span>
    <div class="big" id="bal">৳ ০</div>
    <div class="two">
      <div><span>আজকের আয়</span><b id="ti">৳ ০</b></div>
      <div><span>আজকের ব্যয়</span><b id="te">৳ ০</b></div>
    </div>
  </div>

  <div class="vt" id="vt">
    <button data-v="tally" class="on">ট্যালি খাতা</button>
    <button data-v="list">তালিকা</button>
  </div>
  <div class="filters">
    <input id="q" type="search" placeholder="বিবরণ বা ক্যাটাগরি দিয়ে খুঁজুন">
    <div class="chips" id="chips">
      <button data-t="all" class="on">সব</button>
      <button data-t="income">আয়</button>
      <button data-t="expense">ব্যয়</button>
    </div>
    <select id="fc"></select>
  </div>

  <div id="list"></div>
  <button class="btn fab" id="add">+ হিসাব যোগ করুন</button>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="in" role="dialog" aria-label="নতুন হিসাব">
    <div class="seg" id="seg">
      <button data-t="income" class="income">আয়</button>
      <button data-t="expense" class="expense">ব্যয়</button>
    </div>
    <label>টাকার পরিমাণ<input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="যেমন ৫০০"></label>
    <label>ক্যাটাগরি<select id="cat"></select></label>
    <label>তারিখ<input id="dt" type="date"></label>
    <label>বিবরণ (ঐচ্ছিক)<input id="note" type="text" maxlength="120" placeholder="যেমন সবজি ও মাছ"></label>
    <button class="btn" id="save">সংরক্ষণ করুন</button>
    <button class="btn alt" id="cancel">বাতিল</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://mqkumetfbfnycznnwokj.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xa3VtZXRmYmZueWN6bm53b2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDI0MjIsImV4cCI6MjEwODE3ODQyMn0.JFpBM_hvS_7c4kSu1FMtaR0Z_xkzZtMPYp5bj8KeSaY';
const CAT={income:['বেতন','ব্যবসা','উপহার','অন্যান্য'],expense:['বাজার','খাবার','বাড়িভাড়া','বিল','যাতায়াত','চিকিৎসা','শিক্ষা','অন্যান্য']};

const $=s=>document.querySelector(s);
let sb=null;
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
let pref='1';try{pref=localStorage.getItem('bn')||'1'}catch(e){}
let bn=pref!=='0',user=null,demo=false,tx=[],ft='all',vm='tally',ntype='expense',cid='',saving=false;

const dig=s=>bn?String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):String(s);
const N=v=>dig(Number(v).toLocaleString('en-IN',{maximumFractionDigits:2}));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const sum=a=>a.reduce((s,t)=>s+Math.round(Number(t.amount)*100),0)/100;
const view=v=>{$('#login').hidden=v!=='login';$('#app').hidden=v!=='app'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)};

function fillCats(){
  const all=[...new Set([...CAT.expense,...CAT.income])];
  $('#fc').innerHTML='<option value="">সব ক্যাটাগরি</option>'+all.map(c=>`<option>${esc(c)}</option>`).join('');
}

function render(){
  const inc=sum(tx.filter(t=>t.type==='income')),exp=sum(tx.filter(t=>t.type==='expense')),td=today();
  $('#bal').textContent='৳ '+N(inc-exp);
  $('#ti').textContent='৳ '+N(sum(tx.filter(t=>t.type==='income'&&t.txn_date===td)));
  $('#te').textContent='৳ '+N(sum(tx.filter(t=>t.type==='expense'&&t.txn_date===td)));
  const q=$('#q').value.trim().toLowerCase(),fc=$('#fc').value;
  const rows=tx.filter(t=>(ft==='all'||t.type===ft)&&(!fc||t.category===fc)&&(!q||((t.note||'')+' '+t.category).toLowerCase().includes(q)));
  $('#list').innerHTML=vm==='tally'&&rows.length?tallyHtml(rows):rows.length?rows.map(t=>`<div class="row ${t.type}">
    <div><b>${esc(t.category)}</b><br><small>${esc(t.note||'')}</small></div>
    <div class="amt">${t.type==='income'?'+':'−'} ৳ ${N(t.amount)}<br><small>${dig(t.txn_date.split('-').reverse().join('/'))}</small></div>
    <button class="del" data-id="${esc(t.id)}">মুছুন</button></div>`).join('')
    :`<div class="empty">${tx.length?'এই শর্তে কোনো হিসাব পাওয়া যায়নি।':'এখনো কোনো হিসাব নেই। নিচের বাটনে চেপে প্রথম হিসাব যোগ করুন।'}</div>`;
}

function tallyHtml(rows){
  const bal={};let run=0;
  [...tx].sort((a,b)=>(a.txn_date+(a.created_at||'')).localeCompare(b.txn_date+(b.created_at||''))).forEach(t=>{
    run+=(t.type==='income'?1:-1)*Math.round(Number(t.amount)*100);bal[t.id]=run/100;
  });
  const ti=sum(rows.filter(t=>t.type==='income')),te=sum(rows.filter(t=>t.type==='expense'));
  return '<table class="tally"><thead><tr><th>বিবরণ</th><th>আয়</th><th>ব্যয়</th><th>ব্যালেন্স</th></tr></thead><tbody>'+
  rows.map(t=>`<tr><td><b>${esc(t.category)}</b><small>${dig(t.txn_date.split('-').reverse().join('/'))}${t.note?' · '+esc(t.note):''}</small><button class="del" data-id="${esc(t.id)}">মুছুন</button></td><td class="i">${t.type==='income'?N(t.amount):''}</td><td class="e">${t.type==='expense'?N(t.amount):''}</td><td class="${bal[t.id]<0?'neg':''}">${N(bal[t.id])}</td></tr>`).join('')+
  `</tbody><tfoot><tr><td>মোট</td><td>${N(ti)}</td><td>${N(te)}</td><td>${N(ti-te)}</td></tr></tfoot></table>`;
}

async function load(){
  if(demo){render();return}
  const {data,error}=await sb.from('transactions').select('*').order('txn_date',{ascending:false}).order('created_at',{ascending:false});
  if(error){toast('ডেটা আনা যায়নি: '+error.message);return}
  tx=data;render();
}

function setType(t){
  ntype=t;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#cat').innerHTML=CAT[t].map(c=>`<option>${esc(c)}</option>`).join('');
}
function openSheet(){
  cid=crypto.randomUUID();setType('expense');
  $('#amt').value='';$('#note').value='';$('#dt').value=today();
  $('#sheet').hidden=false;$('#amt').focus();
}
const closeSheet=()=>{$('#sheet').hidden=true};

async function save(){
  if(saving)return;
  const amt=parseFloat($('#amt').value),dt=$('#dt').value;
  if(!(amt>0)){toast('সঠিক টাকার পরিমাণ লিখুন');return}
  if(!dt){toast('তারিখ বেছে নিন');return}
  const row={client_id:cid,type:ntype,amount:amt,category:$('#cat').value,note:$('#note').value.trim()||null,txn_date:dt};
  saving=true;$('#save').disabled=true;
  try{
    if(demo){tx.unshift({...row,id:cid,created_at:new Date().toISOString()});render()}
    else{
      const {error}=await sb.from('transactions').upsert(row,{onConflict:'user_id,client_id',ignoreDuplicates:true});
      if(error){toast('সংরক্ষণ হয়নি: '+error.message);return}
      await load();
    }
    closeSheet();toast('হিসাব সংরক্ষিত হয়েছে');
  }finally{saving=false;$('#save').disabled=false}
}

async function del(id){
  if(!confirm('এই হিসাবটি মুছে ফেলবেন?'))return;
  if(demo){tx=tx.filter(t=>t.id!==id);render();toast('মুছে ফেলা হয়েছে');return}
  const {error}=await sb.from('transactions').delete().eq('id',id);
  if(error){toast('মোছা যায়নি: '+error.message);return}
  await load();toast('মুছে ফেলা হয়েছে');
}

function backup(){
  if(!tx.length){toast('ব্যাকআপ করার মতো কোনো হিসাব নেই');return}
  const blob=new Blob([JSON.stringify(tx,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='hisab-bondhu-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('ব্যাকআপ ফাইল তৈরি হয়েছে');
}

function setUser(u){
  user=u||null;
  if(demo)return;
  if(user){$('#who').textContent=user.email||'';view('app');load()}
  else{tx=[];view('login')}
}

$('#gLogin').onclick=async()=>{
  if(!sb){toast('ইন্টারনেট সংযোগ দরকার');return}
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error)toast('লগইন হয়নি: '+error.message);
};
$('#demoBtn').onclick=()=>{demo=true;tx=[];$('#who').textContent='টেস্ট মোড: ডেটা সংরক্ষিত হবে না';view('app');render()};
$('#out').onclick=async()=>{
  if(demo){demo=false;tx=[];view('login');return}
  if(sb)await sb.auth.signOut();
  setUser(null);
};
$('#dig').onclick=()=>{bn=!bn;try{localStorage.setItem('bn',bn?'1':'0')}catch(e){}$('#dig').textContent=bn?'123':'১২৩';render()};
$('#bak').onclick=backup;
$('#add').onclick=openSheet;
$('#cancel').onclick=closeSheet;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('#save').onclick=save;
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b)setType(b.dataset.t)};
$('#chips').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  ft=b.dataset.t;
  document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
$('#vt').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  vm=b.dataset.v;
  document.querySelectorAll('#vt button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
$('#q').oninput=render;$('#fc').onchange=render;
$('#list').onclick=e=>{const b=e.target.closest('.del');if(b)del(b.dataset.id)};

fillCats();
$('#dig').textContent=bn?'123':'১২৩';
(async()=>{
  if(!sb){view('login');return}
  const {data}=await sb.auth.getSession();
  setUser(data.session&&data.session.user);
  sb.auth.onAuthStateChange((_e,s)=>{const u=s&&s.user;if((u&&u.id)!==(user&&user.id))setUser(u)});
})();
</script>
</body>
</html>
